name: Release

# Roda quando a main recebe o merge da dev (ou manualmente). Calcula a versão
# pelos commits desde a última tag (docs/versioning.md), cria a tag vX.Y.Z e o
# GitHub Release. Sem commits feat/fix novos, nada é publicado.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    name: Calcular versão
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      publish: ${{ steps.v.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - id: v
        run: |
          base=$(node scripts/version.mjs base)
          next=$(node scripts/version.mjs next)
          echo "Última versão: $base; próxima: $next"
          echo "version=$next" >> "$GITHUB_OUTPUT"
          if [ "$base" = "$next" ]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "Sem commits feat/fix desde a última tag: nada a publicar."
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

  # Testes: o push na main sempre vem de um PR que já rodou o CI completo sobre o mesmo código,
  # então repetir aqui só gasta tempo. Só rodam no disparo manual (sem PR por trás).
  # Para voltar a rodar sempre antes de publicar, troque o `if` pela linha comentada.
  tests:
    needs: version
    # if: needs.version.outputs.publish == 'true'
    if: needs.version.outputs.publish == 'true' && github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/ci.yml

  build:
    name: Instaladores (MSI)
    needs: [version, tests]
    # Com os testes pulados (push na main), o build segue; se rodaram e falharam, não publica.
    if: ${{ !cancelled() && needs.version.outputs.publish == 'true' && (needs.tests.result == 'success' || needs.tests.result == 'skipped') }}
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci

      - name: Notas do release
        shell: pwsh
        run: node scripts/version.mjs notes > RELEASE_NOTES.md

      - name: Aplicar versão (tauri.conf.json, package.json e Cargo.toml)
        shell: pwsh
        run: node scripts/version.mjs apply "${{ needs.version.outputs.version }}"

      - name: Gerar MSI (WiX)
        shell: pwsh
        run: npx tauri build --bundles msi

      # MSIX desligado até a identidade da Store e as imagens/logo estarem prontas.
      # Para religar, descomente este passo e a linha dist/*.msix em files (docs/msix-store.md).
      # - name: Gerar exe para o MSIX
      #   shell: pwsh
      #   run: npx tauri build --no-bundle
      #
      # - name: Gerar MSIX (MakeAppx)
      #   continue-on-error: true
      #   shell: pwsh
      #   # Dados públicos da identidade do app na Store (GitHub Variables, não secrets)
      #   env:
      #     MSIX_IDENTITY_NAME: ${{ vars.MSIX_IDENTITY_NAME }}
      #     MSIX_PUBLISHER: ${{ vars.MSIX_PUBLISHER }}
      #     MSIX_PUBLISHER_DISPLAY: ${{ vars.MSIX_PUBLISHER_DISPLAY }}
      #   run: >
      #     ./packaging/msix/build-msix.ps1
      #     -Version "${{ needs.version.outputs.version }}"
      #     -Exe (Get-ChildItem target/release/*.exe | Select-Object -First 1).FullName
      #     -Out dist/Cap-${{ needs.version.outputs.version }}-x64.msix

      - name: Reunir artefatos, tamanhos e SHA256
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Get-ChildItem target/release/bundle/msi/*.msi | Copy-Item -Destination dist
          Get-ChildItem dist | ForEach-Object {
            "{0}: {1:N2} MB" -f $_.Name, ($_.Length / 1MB)
          }
          Get-ChildItem dist -File | ForEach-Object {
            "{0}  {1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower(), $_.Name
          } | Set-Content dist/SHA256SUMS -Encoding ascii
          Get-Content dist/SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: instaladores
          path: dist/*

      # Cria a tag vX.Y.Z no commit da main e o Release com as notas geradas
      - name: Publicar no GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: v${{ needs.version.outputs.version }}
          body_path: RELEASE_NOTES.md
          # MSIX desligado: para religar, inclua a linha dist/*.msix na lista abaixo.
          files: |
            dist/*.msi
            dist/SHA256SUMS
