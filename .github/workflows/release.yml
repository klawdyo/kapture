name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  tests:
    uses: ./.github/workflows/ci.yml

  build:
    name: Instaladores (MSI e MSIX)
    needs: tests
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci

      - name: Versão a partir da tag
        id: ver
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -like 'refs/tags/v*') {
            $v = $env:GITHUB_REF_NAME.TrimStart('v')
          } else {
            $v = (Get-Content package.json -Raw | ConvertFrom-Json).version
          }
          "version=$v" >> $env:GITHUB_OUTPUT
          "Versão: $v"

      - name: Aplicar versão no tauri.conf.json
        shell: pwsh
        run: |
          node -e "const f='src-tauri/tauri.conf.json';const c=JSON.parse(require('fs').readFileSync(f,'utf8'));c.version=process.argv[1];require('fs').writeFileSync(f,JSON.stringify(c,null,2))" "${{ steps.ver.outputs.version }}"

      - name: Gerar MSI (WiX)
        shell: pwsh
        run: npx tauri build --bundles msi

      - name: Gerar exe para o MSIX
        shell: pwsh
        run: npx tauri build --no-bundle

      - name: Gerar MSIX (MakeAppx)
        continue-on-error: true
        shell: pwsh
        run: >
          ./packaging/msix/build-msix.ps1
          -Version "${{ steps.ver.outputs.version }}"
          -Exe (Get-ChildItem target/release/*.exe | Select-Object -First 1).FullName
          -Out dist/Cap-${{ steps.ver.outputs.version }}-x64.msix

      - name: Reunir artefatos, tamanhos e SHA256
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Get-ChildItem target/release/bundle/msi/*.msi | Copy-Item -Destination dist
          Get-ChildItem dist | ForEach-Object {
            "{0}: {1:N2} MB" -f $_.Name, ($_.Length / 1MB)
          }
          Get-ChildItem dist -File | ForEach-Object {
            "{0}  {1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower(), $_.Name
          } | Set-Content dist/SHA256SUMS -Encoding ascii
          Get-Content dist/SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: instaladores
          path: dist/*

      # Publica ao empurrar uma tag v* ou ao disparar manualmente (nesse caso o release cria a tag vX.Y.Z)
      - name: Publicar no GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: |
            dist/*.msi
            dist/*.msix
            dist/SHA256SUMS
          generate_release_notes: true
