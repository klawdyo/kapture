name: CI

on:
  # Push desligado: o PR já roda o CI e o release.yml chama este workflow antes de publicar.
  # Para voltar a rodar a cada push na dev, descomente:
  # push:
  #   branches: [dev]
  pull_request:
    branches: [main, dev]
  workflow_call:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    name: Linux (núcleo e front-end)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy, llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      - name: Formatação
        run: cargo fmt --all -- --check
      - name: Clippy do núcleo
        run: cargo clippy -p cap-core --all-targets -- -D warnings
      - name: Cobertura do cap-core (100% das linhas)
        run: cargo llvm-cov -p cap-core --fail-under-lines 100
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npx vue-tsc --noEmit
      - name: Vitest com cobertura 100%
        run: >
          npx vitest run --coverage
          --coverage.thresholds.lines=100
          --coverage.thresholds.functions=100
          --coverage.thresholds.branches=100
          --coverage.thresholds.statements=100

  windows:
    name: Windows (workspace e Tauri)
    # PR para dev roda só o Linux (rápido). Windows roda em PR para main e no release.
    # Para rodar sempre, comente a linha abaixo.
    if: github.event_name != 'pull_request' || github.base_ref == 'main'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Testes do workspace inteiro
        run: cargo test --workspace
      - name: Check do src-tauri
        run: cargo check --manifest-path src-tauri/Cargo.toml

  # Garante que o site (Nuxt) gera o estático sem erros
  site:
    name: Site (Nuxt generate)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - run: npm run generate

  # Instalador de teste (Velopack): só em PR para a main. Gera o kapture-win-Setup.exe com uma
  # versão fictícia (0.0.1-pr.N) e publica como artefato (7 dias) para baixar e conferir o visual
  # do instalador ANTES do release. O resumo do job mostra os tamanhos (exe, Setup, nupkg, zip).
  installer:
    name: Instalador (Velopack, teste)
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Compilar o exe (sem bundle)
        run: npx tauri build --no-bundle
      - name: Empacotar com Velopack
        shell: pwsh
        run: ./scripts/pack-velopack.ps1 -Version 0.0.1-pr.${{ github.run_number }}
      - uses: actions/upload-artifact@v4
        with:
          name: kapture-setup
          retention-days: 7
          path: |
            Releases/*-Setup.exe
            Releases/*.nupkg

  # Job do MSI desligado: o release.yml já gera o MSI. Para voltar a validar o empacotamento
  # em todo PR, descomente o bloco abaixo.
