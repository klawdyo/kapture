[package]
name = "cap"
version = "0.1.0"
edition = "2021"
description = "kapture: gravador de tela leve para Windows (adaptadores Tauri + Windows)"
license = "MIT"
build = "build.rs"

[lib]
name = "cap_lib"
path = "src/lib.rs"

[[bin]]
name = "kapture"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", default-features = false, features = [] }

[dependencies]
cap-core = { path = "../crates/cap-core" }
# Só o necessário: `wry` (WebView2). Sem compressão de assets, sem
# common-controls-v6 (não usamos diálogos nativos) e sem recursos de Linux.
tauri = { version = "2", default-features = false, features = ["wry"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Windows: Velopack (instalador por usuário e atualização). O hook `VelopackApp::run()` precisa
# ser a primeira chamada do main. A versão deste crate e a do `vpk` (CLI) têm de ser IGUAIS
# (docs/BUILD.md; o scripts/pack-velopack.ps1 lê esta versão do Cargo.lock).
[target.'cfg(windows)'.dependencies.velopack]
version = "1.2.161"
default-features = false

# Windows: somente as features realmente usadas pelos adaptadores.
# O atalho global usa RegisterHotKey (user32) em vez de um plugin extra.
[target.'cfg(windows)'.dependencies.windows]
version = "0.62"
features = [
  "Foundation",
  "Graphics",
  "Graphics_Capture",
  "Graphics_DirectX",
  "Graphics_DirectX_Direct3D11",
  "Win32_Foundation",
  "Win32_Graphics_Direct3D",
  "Win32_Graphics_Direct3D11",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Dxgi",
  "Win32_Graphics_Dxgi_Common",
  "Win32_Graphics_Gdi",
  "Win32_Media_Audio",
  "Win32_Media_MediaFoundation",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_SystemInformation",
  "Win32_System_Threading",
  "Win32_System_WinRT",
  "Win32_System_WinRT_Direct3D11",
  "Win32_System_WinRT_Graphics_Capture",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_Shell_PropertiesSystem",
  "Wdk_System_SystemServices",
  "Win32_Devices_FunctionDiscovery",
  "Win32_UI_WindowsAndMessaging",
]
